name: Update userscripts

on:
  push:
    branches:
      - main
    paths:
      - pixiv-preview/**
      - twitter-minimal/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/update-pixiv-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-userscripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build userscripts
        run: npm run build

      - name: Commit generated userscripts
        run: |
          git add -- pixiv-preview/dist/pixiv-preview.user.js twitter-minimal/dist/twitter-minimal.user.js
          if git diff --cached --quiet -- pixiv-preview/dist/pixiv-preview.user.js twitter-minimal/dist/twitter-minimal.user.js; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild userscripts"
          git push
